<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu | Saffron Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* --- App Theme --- */
        :root {
            --app-bg: #f8f9fa;
            --app-card: #ffffff;
            --app-text: #1c1c1c;
            --app-muted: #6b6b6b;
            --app-green: #132a1e;
            --app-gold: #c5a059;
            --app-orange: #fc8019;
            --app-border: #e2e2e7;
            --app-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --app-success: #1aab2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--app-bg);
            color: var(--app-text);
            overflow-x: hidden;
            width: 100%;
            height: 100vh;
            /* Page Entry Fade In */
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; }

        /* --- App Header --- */
        .app-header {
            background: var(--app-green);
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .app-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--app-gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover { color: white; }

        .app-brand { text-align: center; }
        .app-brand h2 { font-size: 22px; color: var(--app-gold); margin-bottom: 2px; line-height: 1; }
        .app-brand p { font-size: 10px; letter-spacing: 1px; color: #ddd; }

        .search-container { position: relative; width: 100%; max-width: 1200px; margin: 0 auto; }
        .search-container input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 10px; border: none; outline: none;
            font-size: 14px; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .search-container input::placeholder { color: rgba(255,255,255,0.7); }
        .search-container input:focus { background: white; color: var(--app-text); border-color: var(--app-gold); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.7); width: 18px; }

        /* --- App Layout --- */
        .app-main-layout {
            display: flex;
            gap: 20px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .app-sidebar {
            width: 220px;
            background: var(--app-card);
            border-radius: 12px;
            box-shadow: var(--app-shadow);
            border: 1px solid var(--app-border);
            position: sticky;
            top: 120px; 
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .app-sidebar-title {
            padding: 12px 15px; font-family: 'Cormorant Garamond', serif; font-size: 16px;
            color: var(--app-green); border-bottom: 1px solid var(--app-border); background: #f4f6f5;
            position: sticky; top: 0; font-weight: 700;
        }

        .app-sidebar-list { list-style: none; }
        .app-sidebar-item {
            padding: 12px 15px; font-size: 13px; font-weight: 700; color: var(--app-muted);
            cursor: pointer; border-left: 3px solid transparent; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .app-sidebar-item i { width: 16px; height: 16px; }
        .app-sidebar-item:hover { background: var(--app-bg); color: var(--app-text); }
        .app-sidebar-item.active { border-left-color: var(--app-orange); background: #fff4ec; color: var(--app-orange); }

        .app-content { flex-grow: 1; min-width: 0; }
        
        .app-section-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--app-green); margin-bottom: 15px; font-weight: 700; }

        .app-food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }

        .app-card {
            background: var(--app-card); border-radius: 12px; overflow: hidden;
            box-shadow: var(--app-shadow); border: 1px solid var(--app-border);
            transition: transform 0.3s; cursor: pointer; display: flex; flex-direction: column;
        }
        .app-card:hover { transform: translateY(-3px); }

        .app-card-img { position: relative; height: 160px; width: 100%; background: #f0f0f0; }
        .app-card-img img { width: 100%; height: 100%; object-fit: cover; }

        .veg-badge { position: absolute; top: 8px; right: 8px; background: white; padding: 2px; border-radius: 3px; }
        .veg-badge .square { width: 10px; height: 10px; border: 1.5px solid var(--app-success); display: flex; justify-content: center; align-items: center; }
        .veg-badge .square.non-veg { border-color: #d32f2f; }
        .veg-badge .circle { width: 4px; height: 4px; background: var(--app-success); border-radius: 50%; }
        .veg-badge .circle.non-veg { background: #d32f2f; }

        .app-card-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .app-title-price { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; gap: 8px; }
        .app-title-price h3 { font-size: 15px; font-weight: 800; color: var(--app-text); line-height: 1.2; }
        .app-price { font-size: 14px; font-weight: 800; color: var(--app-green); background: #eef2f0; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
        .app-desc { font-size: 12px; color: var(--app-muted); margin-bottom: 10px; flex-grow: 1; line-height: 1.4; }
        .app-card-bottom { border-top: 1px dashed var(--app-border); padding-top: 8px; }
        .app-time { font-size: 11px; font-weight: 800; color: var(--app-orange); display: flex; align-items: center; gap: 4px; }

        /* =========================================
           SKELETON LOADING ANIMATION
           ========================================= */
        .skeleton {
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .skeleton-card {
            background: var(--app-card);
            border-radius: 12px;
            border: 1px solid var(--app-border);
            overflow: hidden;
            height: 300px;
            display: flex;
            flex-direction: column;
        }
        
        .skeleton-img { height: 160px; width: 100%; border-radius: 0; }
        .skeleton-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; gap: 10px;}
        .skeleton-title { height: 18px; width: 70%; border-radius: 4px; }
        .skeleton-price { height: 18px; width: 30%; border-radius: 4px; }
        .skeleton-desc { height: 12px; width: 100%; border-radius: 4px; }
        .skeleton-desc.short { width: 80%; }

        /* Hide actual grid initially */
        .app-food-grid { display: none; }
        .app-food-grid.loaded { display: grid; }
        
        /* Sidebar Skeleton */
        .skeleton-sidebar { padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        /* --- Modal --- */
        .app-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(3px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
        }
        .app-modal-content {
            background: var(--app-card); width: 100%; max-width: 380px; border-radius: 16px;
            padding: 15px; max-height: 90vh; overflow-y: auto; position: relative;
            animation: scaleUp 0.3s ease-out;
        }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .app-modal-close { position: absolute; top: 10px; right: 10px; background: var(--app-bg); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 2; }
        .app-modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        .app-modal-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; color: var(--app-green); }
        .app-modal-price { font-size: 18px; font-weight: 800; color: var(--app-orange); margin-bottom: 15px; }
        .app-modal-desc { background: var(--app-bg); padding: 12px; border-radius: 8px; font-size: 13px; color: var(--app-muted); line-height: 1.5; }

        /* Responsive */
        @media (max-width: 850px) {
            .app-main-layout { flex-direction: column; padding: 10px; gap: 10px; }
            .app-sidebar { width: 100%; position: static; max-height: none; border-radius: 10px; padding-bottom: 0; overflow: visible; }
            .app-sidebar-title { display: none; }
            .app-sidebar-list { display: flex; overflow-x: auto; scrollbar-width: none; padding: 10px; gap: 8px; }
            .app-sidebar-list::-webkit-scrollbar { display: none; }
            .app-sidebar-item { white-space: nowrap; padding: 8px 14px; border: 1px solid var(--app-border); border-radius: 20px; border-left: none; font-size: 12px; background: white; }
            .app-sidebar-item.active { background: var(--app-orange); color: white; border-color: var(--app-orange); }

            .app-food-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .app-card-img { height: 120px; }
            .app-card-info { padding: 10px; }
            .app-title-price { flex-direction: column; gap: 4px; }
            .app-title-price h3 { font-size: 13px; }
            .app-price { font-size: 13px; align-self: flex-start; }
            .app-desc { display: none; }
            
            .skeleton-card { height: 260px; }
            .skeleton-img { height: 120px; }
        }
    </style>
</head>

        const foodGrid = document.getElementById('foodGrid');
        const skeletonGrid = document.getElementById('skeletonGrid');
        const sidebarSkeleton = document.getElementById('sidebarSkeleton');
        const actualSidebar = document.getElementById('actualSidebar');
        const sectionHeading = document.getElementById('sectionHeading');
        const fallbackImg = "https://via.placeholder.com/400x220?text=Image+Missing";

        // --- SKELETON LOADING LOGIC ---
        // Show skeleton for 1.5 seconds, then load actual data
        setTimeout(() => {
            // Hide Skeletons
            skeletonGrid.style.display = 'none';
            sidebarSkeleton.style.display = 'none';
            
            // Show Actual Content
            actualSidebar.style.display = 'block';
            foodGrid.classList.add('loaded');
            sectionHeading.innerText = "All Food Items";

            // Render Menu
            renderMenu(menuData);
        }, 1500); // 1.5 seconds delay

        function renderMenu(items) {
            foodGrid.innerHTML = '';
            if(items.length === 0) {
                foodGrid.innerHTML = `<div style="text-align:center; padding: 50px; width:100%; grid-column: 1/-1; color: var(--app-muted);"><h3>No dishes found</h3></div>`;
                return;
            }
            
            items.forEach(item => {
                const vegHtml = item.veg 
                    ? `<div class="square"><div class="circle"></div></div>` 
                    : `<div class="square non-veg"><div class="circle non-veg"></div></div>`;
                
                const card = `
                    <div class="app-card" onclick="openModal('${item.name}', '₹${item.price}', '${item.desc}', '${item.img}')">
                        <div class="app-card-img">
                            <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
                            <div class="veg-badge">${vegHtml}</div>
                        </div>
                        <div class="app-card-info">
                            <div class="app-title-price">
                                <h3>${item.name}</h3>
                                <span class="app-price">₹${item.price}</span>
                            </div>
                            <p class="app-desc">${item.desc}</p>
                            <div class="app-card-bottom">
                                <span class="app-time"><i data-lucide="check-circle-2" style="width: 12px;"></i> Available</span>
                            </div>
                        </div>
                    </div>
                `;
                foodGrid.innerHTML += card;
            });
            lucide.createIcons();
        }

        // --- Search & Filter Logic ---
        let currentCategory = 'all';

        function filterCategory(category, element) {
            document.querySelectorAll('.app-sidebar-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            currentCategory = category;
            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        function searchFood() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = menuData.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.cat === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            if(query.length > 0) {
                sectionHeading.innerText = `Search Results for "${query}"`;
            } else if(currentCategory === 'all') {
                sectionHeading.innerText = "All Food Items";
            } else {
                sectionHeading.innerText = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1) + " Menu";
            }

            renderMenu(filtered);
        }

        // --- Modal Logic ---
        const modal = document.getElementById('foodModal');
        
        function openModal(title, price, desc, imgSrc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalDesc').innerText = desc;
            
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modalImg.onerror = function() {
                this.onerror=null; 
                this.src=fallbackImg;
            };

            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        // Initialize Icons
        lucide.createIcons();
    </script>
