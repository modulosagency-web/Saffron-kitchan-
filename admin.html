<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Saffron Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-emerald: #051a12;
            --bg-card: #0a261b;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f5e18f 50%, #b58d22 100%);
            --text-light: #f9f9f9;
            --text-muted: #a3b3ab;
            --error: #d32f2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-emerald);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Login Card */
        .login-card {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top: 4px solid var(--gold);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 20px; font-size: 24px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.3); color: white; font-size: 16px; outline: none; }
        .input-group input:focus { border-color: var(--gold); }
        .btn { width: 100%; padding: 15px; background: var(--gold-gradient); color: var(--bg-emerald); border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn:hover { opacity: 0.9; }

        /* Admin Panel (Hidden initially) */
        #adminPanel { display: none; }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top: 4px solid var(--gold);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
        }

        .card-header h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 20px; display: flex; align-items: center; gap: 10px;}

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 5px; font-weight: 700; }

        input[type="text"], input[type="password"], input[type="number"], textarea, select {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 175, 55, 0.3); color: white; font-size: 14px; outline: none;
        }

        select option { background: var(--bg-emerald); color: white; }
        textarea { height: 80px; resize: vertical; }

        .file-upload-wrapper {
            border: 2px dashed rgba(212, 175, 55, 0.4); padding: 20px;
            text-align: center; cursor: pointer; position: relative; background: rgba(0,0,0,0.2);
        }

        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-img { max-width: 100%; height: 150px; object-fit: cover; margin-top: 10px; display: none; border: 1px solid var(--gold); }

        .btn-secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); }

        .error-msg { color: var(--error); font-size: 13px; margin-top: 10px; display: none; }

        /* --- Delete List Styles --- */
        .delete-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .delete-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(212, 175, 55, 0.1); padding: 10px; border-radius: 4px;}
        .delete-item-info { display: flex; align-items: center; gap: 15px; }
        .delete-item-info img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid var(--gold);}
        .delete-item-info h4 { font-size: 14px; color: var(--text-light); margin-bottom: 3px;}
        .delete-item-info p { font-size: 12px; color: var(--gold); }
        .btn-delete { background: #d32f2f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: 0.3s;}
        .btn-delete:hover { background: #b71c1c; }
        .empty-list-msg { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGIN SECTION -->
        <div class="login-card" id="loginSection">
            <h2><i data-lucide="lock"></i> Admin Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Enter password to manage menu.</p>
            <div class="input-group">
                <input type="password" id="adminPassword" placeholder="Enter Password">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <p class="error-msg" id="loginError">Incorrect password! Try again.</p>
        </div>

        <!-- ADMIN PANEL (Hidden) -->
        <div id="adminPanel">
            
            <div class="card" style="border-top: 2px solid var(--gold); padding: 20px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-family: 'Cinzel', serif; color: var(--gold); font-size: 18px;">Welcome, Admin</h3>
                    <button onclick="logout()" style="background: transparent; border: none; color: #ff6b6b; cursor: pointer; display: flex; align-items: center; gap: 5px;"><i data-lucide="log-out" style="width: 16px;"></i> Logout</button>
                </div>
            </div>

            <!-- GitHub Token Setup -->
            <div class="card">
                <div class="card-header">
                    <h2><i data-lucide="key"></i> GitHub Token</h2>
                    <span id="tokenStatus" style="font-size: 10px; background: rgba(26,171,42,0.2); color: #1aab2a; padding: 4px 8px; border-radius: 4px; display: none;">Saved</span>
                </div>
                <div class="form-group">
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxx">
                    <p style="font-size: 10px; color: var(--text-muted); margin-top: 5px;">Requires 'repo' permission.</p>
                </div>
                <button class="btn btn-secondary" onclick="saveToken()">Save Token</button>
            </div>

            <!-- Add New Dish -->
            <div class="card">
                <div class="card-header">
                    <h2><i data-lucide="upload-cloud"></i> Add New Dish</h2>
                </div>
                
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Dish Title (Will be used as file name)</label>
                        <input type="text" id="dishName" placeholder="e.g., Special Chicken Biryani" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Price (₹)</label>
                            <input type="number" id="dishPrice" placeholder="180" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="dishCategory" required>
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                                <option value="beverages">Hot Beverages</option>
                                <option value="juices">Juices</option>
                                <option value="mojito">Mojito & Lime</option>
                                <option value="shakes">Shakes & Smoothies</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="dishDesc" placeholder="Short description..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Food Image (Any Name)</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="dishImage" accept="image/*" required>
                            <div style="color: var(--text-muted); font-size: 13px;">
                                <i data-lucide="image" style="width: 24px; height: 24px; margin-bottom: 5px; color: var(--gold);"></i><br>
                                Click to select photo
                            </div>
                            <img id="imagePreview" class="preview-img" alt="Preview">
                        </div>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        <i data-lucide="check-circle"></i> Upload to Website
                    </button>
                </form>
            </div>

            <!-- Manage & Delete Menu -->
            <div class="card">
                <div class="card-header">
                    <h2><i data-lucide="trash-2"></i> Manage Menu (Delete)</h2>
                </div>
                <div class="delete-list" id="deleteList">
                    <!-- Items will load here -->
                    <p class="empty-list-msg">Loading menu items...</p>
                </div>
            </div>
            
            <a href="index.html" style="display: block; text-align: center; color: var(--text-muted); text-decoration: none; margin-top: 10px; font-size: 13px; margin-bottom: 40px;">← Back to Website</a>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // --- CONFIGURATION ---
        const ADMIN_PASSWORD = "saffron@123";
        const GITHUB_USERNAME = "modulosagency-web"; 
        const REPO_NAME = "Saffron-kitchan-";
        const IMAGE_FOLDER_PATH = "Assets/images/foods/";
        const DATA_FILE_PATH = "menu.json"; 

        let menuData = []; // Global variable to store menu data

        // Check Session on Load
        window.onload = function() {
            if(sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                showAdminPanel();
            }
            const savedToken = localStorage.getItem('ghToken');
            if(savedToken) {
                document.getElementById('ghToken').value = savedToken;
                document.getElementById('tokenStatus').style.display = 'inline-block';
            }
        };

        // Login Logic
        function login() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showAdminPanel();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function showAdminPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadMenuForDeletion(); // Load items for delete list
        }

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        // Save Token
        function saveToken() {
            const token = document.getElementById('ghToken').value.trim();
            if(!token) { alert("Enter token first!"); return; }
            localStorage.setItem('ghToken', token);
            document.getElementById('tokenStatus').style.display = 'inline-block';
            alert("Token saved successfully!");
            loadMenuForDeletion(); // Try loading again if token is new
        }

        // Image Preview
        document.getElementById('dishImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('imagePreview');
                    img.src = event.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Helper: File to Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        // Helper: GitHub API Get
        async function getFileFromGitHub(path, token) {
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${path}?t=${new Date().getTime()}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (response.status === 404) return null; 
            if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
            return await response.json();
        }

        // --- LOAD MENU FOR DELETE LIST ---
        async function loadMenuForDeletion() {
            const token = localStorage.getItem('ghToken');
            const deleteListDiv = document.getElementById('deleteList');

            if(!token) {
                deleteListDiv.innerHTML = `<p class="empty-list-msg">Save GitHub Token to load items.</p>`;
                return;
            }

            deleteListDiv.innerHTML = `<p class="empty-list-msg">Loading items...</p>`;

            try {
                const menuFileInfo = await getFileFromGitHub(DATA_FILE_PATH, token);
                if (menuFileInfo) {
                    const decodedContent = decodeURIComponent(escape(window.atob(menuFileInfo.content.replace(/\s/g, ''))));
                    menuData = JSON.parse(decodedContent);
                    
                    deleteListDiv.innerHTML = '';
                    if(menuData.length === 0) {
                        deleteListDiv.innerHTML = `<p class="empty-list-msg">No items in menu yet.</p>`;
                        return;
                    }

                    // Reverse to show newest first
                    [...menuData].reverse().forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'delete-item';
                        div.innerHTML = `
                            <div class="delete-item-info">
                                <img src="${item.img}" onerror="this.src='https://via.placeholder.com/50?text=Err'">
                                <div>
                                    <h4>${item.name}</h4>
                                    <p>₹${item.price}</p>
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deleteMenuItem(${item.id}, '${item.img}')">
                                <i data-lucide="trash" style="width: 14px;"></i> Delete
                            </button>
                        `;
                        deleteListDiv.appendChild(div);
                    });
                    lucide.createIcons();
                } else {
                    deleteListDiv.innerHTML = `<p class="empty-list-msg">menu.json not found on GitHub yet.</p>`;
                }
            } catch (error) {
                deleteListDiv.innerHTML = `<p class="empty-list-msg" style="color: red;">Error loading menu: ${error.message}</p>`;
            }
        }

        // --- DELETE FUNCTION ---
        async function deleteMenuItem(id, imagePath) {
            if(!confirm("Are you sure you want to delete this item?")) return;

            const token = localStorage.getItem('ghToken');
            if(!token) { alert("Save GitHub Token first!"); return; }

            try {
                // 1. Delete Image from GitHub
                const imageFileInfo = await getFileFromGitHub(imagePath, token);
                if (imageFileInfo) {
                    const deleteImgRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${imagePath}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                        body: JSON.stringify({
                            message: `Admin: Delete image ${imagePath}`,
                            sha: imageFileInfo.sha
                        })
                    });
                    if(!deleteImgRes.ok) console.error("Could not delete image, maybe it was already removed.");
                }

                // 2. Remove Item from menu.json
                const menuFileInfo = await getFileFromGitHub(DATA_FILE_PATH, token);
                if (!menuFileInfo) throw new Error("Menu file not found.");

                const decodedContent = decodeURIComponent(escape(window.atob(menuFileInfo.content.replace(/\s/g, ''))));
                let currentMenuData = JSON.parse(decodedContent);

                // Filter out the item with the matching ID
                const updatedMenuData = currentMenuData.filter(item => item.id !== id);

                // Encode and Upload updated menu.json
                const updatedMenuJson = JSON.stringify(updatedMenuData, null, 4);
                const base64Menu = btoa(unescape(encodeURIComponent(updatedMenuJson)));

                const menuRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${DATA_FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({
                        message: `Admin: Removed item`,
                        content: base64Menu,
                        sha: menuFileInfo.sha
                    })
                });

                if (!menuRes.ok) throw new Error(`Failed to update menu.json`);

                alert("Item deleted successfully!");
                loadMenuForDeletion(); // Refresh the list

            } catch (error) {
                alert(`Error deleting item: ${error.message}`);
            }
        }

        // Main Upload Function
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('ghToken');
            if(!token) { alert("Save GitHub Token first!"); return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader" class="spin"></i> Uploading...`;
            lucide.createIcons();

            try {
                const dishName = document.getElementById('dishName').value.trim();
                const dishPrice = parseInt(document.getElementById('dishPrice').value);
                const dishCategory = document.getElementById('dishCategory').value;
                const dishDesc = document.getElementById('dishDesc').value.trim();
                const file = document.getElementById('dishImage').files[0];

                if (!file) throw new Error("Select an image.");

                // 1. Rename & Upload Image
                let fileExt = file.name.split('.').pop().toLowerCase();
                let safeFileName = dishName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                const finalImageName = `${safeFileName}.${fileExt}`;
                const fullImagePath = `${IMAGE_FOLDER_PATH}${finalImageName}`;

                const base64Image = await toBase64(file);
                
                let existingImage = await getFileFromGitHub(fullImagePath, token);
                const imageBody = { message: `Upload image: ${dishName}`, content: base64Image };
                if(existingImage) imageBody.sha = existingImage.sha;

                const imgRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${fullImagePath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify(imageBody)
                });
                if (!imgRes.ok) throw new Error(`Image upload failed: ${(await imgRes.json()).message}`);

                // 2. Update menu.json
                submitBtn.innerHTML = `<i data-lucide="loader" class="spin"></i> Updating Data...`;
                lucide.createIcons();

                let currentMenuData = [];
                let menuFileSha = null;
                
                const menuFileInfo = await getFileFromGitHub(DATA_FILE_PATH, token);
                if (menuFileInfo) {
                    menuFileSha = menuFileInfo.sha;
                    const decodedContent = decodeURIComponent(escape(window.atob(menuFileInfo.content.replace(/\s/g, ''))));
                    currentMenuData = JSON.parse(decodedContent);
                }

                const newItem = {
                    id: Date.now(),
                    name: dishName,
                    price: dishPrice,
                    cat: dishCategory,
                    desc: dishDesc,
                    img: fullImagePath,
                    veg: true 
                };

                currentMenuData.push(newItem);

                const updatedMenuJson = JSON.stringify(currentMenuData, null, 4);
                const base64Menu = btoa(unescape(encodeURIComponent(updatedMenuJson)));

                const menuBody = { message: `Add item: ${dishName}`, content: base64Menu };
                if (menuFileSha) menuBody.sha = menuFileSha;

                const menuRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${DATA_FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify(menuBody)
                });
                if (!menuRes.ok) throw new Error(`Menu update failed: ${(await menuRes.json()).message}`);

                alert(`Success! ${dishName} added successfully.`);
                document.getElementById('uploadForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
                
                loadMenuForDeletion(); // Refresh delete list with new item

            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="check-circle"></i> Upload to Website`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
