<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Saffron Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-emerald: #051a12;
            --bg-card: #0a261b;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f5e18f 50%, #b58d22 100%);
            --text-light: #f9f9f9;
            --text-muted: #a3b3ab;
            --error: #d32f2f;
            --success: #1aab2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-emerald);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .admin-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* --- Cards --- */
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top: 4px solid var(--gold);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
        }

        .card-header h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            color: var(--gold);
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        input[type="text"], input[type="password"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: white;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--gold);
            background: rgba(255,255,255,0.1);
        }

        select option { background: var(--bg-emerald); color: white; }
        textarea { resize: vertical; height: 90px; }

        /* File Upload */
        .file-upload-wrapper {
            border: 2px dashed rgba(212, 175, 55, 0.4);
            padding: 25px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            background: rgba(0,0,0,0.2);
        }

        .file-upload-wrapper:hover { background: rgba(212, 175, 55, 0.05); border-color: var(--gold); }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { color: var(--text-muted); font-size: 14px; pointer-events: none; }
        .preview-img { max-width: 100%; height: 180px; object-fit: cover; margin-top: 15px; display: none; border: 1px solid var(--gold); }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            background: var(--gold-gradient);
            color: var(--bg-emerald);
            border: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); }

        /* Loader Animation */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Link */
        .back-link {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>

    <div class="admin-container">
        
        <!-- 1. Token Settings Card -->
        <div class="card" id="settingsCard">
            <div class="card-header">
                <h2><i data-lucide="key"></i> GitHub Access</h2>
                <span style="font-size: 10px; color: var(--success); background: rgba(26,171,42,0.2); padding: 4px 8px; border-radius: 4px; display: none;" id="saveBadge">Token Saved</span>
            </div>
            
            <div class="form-group">
                <label>Personal Access Token (PAT)</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxx">
                <p style="font-size: 10px; color: var(--text-muted); margin-top: 5px;">
                    Username: <b>modulosagency-web</b> | Repo: <b>Saffron-kitchan-</b> <br>
                    (Token requires 'repo' permissions).
                </p>
            </div>

            <button type="button" class="btn btn-secondary" onclick="saveToken()">
                <i data-lucide="save"></i> Save Token
            </button>
        </div>

        <!-- 2. Upload Dish Card -->
        <div class="card">
            <div class="card-header">
                <h2><i data-lucide="upload-cloud"></i> Add New Dish</h2>
            </div>
            
            <form id="uploadForm">
                <div class="form-group">
                    <label>Dish Name</label>
                    <input type="text" id="dishName" placeholder="e.g., Special Chicken Biryani" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Price (₹)</label>
                        <input type="number" id="dishPrice" placeholder="e.g., 180" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="dishCategory" required>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="beverages">Hot Beverages</option>
                            <option value="juices">Juices</option>
                            <option value="mojito">Mojito & Lime</option>
                            <option value="shakes">Shakes & Smoothies</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="dishDesc" placeholder="Short description of the dish..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Food Image</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="dishImage" accept="image/png, image/jpeg, image/webp" required>
                        <div class="file-upload-text">
                            <i data-lucide="image" style="width: 30px; height: 30px; margin-bottom: 10px; color: var(--gold);"></i><br>
                            Click to upload or drag & drop
                        </div>
                        <img id="imagePreview" class="preview-img" alt="Preview">
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <i data-lucide="check-circle"></i> Upload to Website
                </button>
            </form>
        </div>

        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Back to Website
        </a>

    </div>

    <script>
        lucide.createIcons();

        // --- DEFAULT GITHUB CONFIGURATION ---
        // Aapke screenshot ke hisaab se set kiya gaya hai
        const GITHUB_USERNAME = "modulosagency-web"; 
        const REPO_NAME = "Saffron-kitchan-";
        const IMAGE_FOLDER_PATH = "Assets/images/foods/";
        const DATA_FILE_PATH = "menu.json"; 

        // Load saved token on page load
        window.onload = function() {
            const savedToken = localStorage.getItem('ghToken');
            if(savedToken) {
                document.getElementById('ghToken').value = savedToken;
                document.getElementById('saveBadge').style.display = 'inline-block';
            }
        };

        // Save Token Function
        function saveToken() {
            const token = document.getElementById('ghToken').value.trim();

            if(!token) {
                alert("Please enter your GitHub Token!");
                return;
            }

            localStorage.setItem('ghToken', token);
            document.getElementById('saveBadge').style.display = 'inline-block';
            alert("Token saved successfully! You can now upload dishes.");
        }

        // File Preview
        const imageInput = document.getElementById('dishImage');
        const previewImg = document.getElementById('imagePreview');
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Helper: File to Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        // Helper: Fetch file SHA from GitHub
        async function getFileFromGitHub(path, token) {
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${path}?t=${new Date().getTime()}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${token}` }
            });
            
            if (response.status === 404) return null; 
            if (!response.ok) throw new Error(`GitHub API Error: ${response.statusText}`);
            
            return await response.json();
        }

        // Main Upload Form Submit
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = localStorage.getItem('ghToken');

            if(!token) {
                alert("Please enter and save your GitHub Token first!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader" class="spin"></i> Uploading Image...`;
            lucide.createIcons();

            try {
                const dishName = document.getElementById('dishName').value.trim();
                const dishPrice = parseInt(document.getElementById('dishPrice').value);
                const dishCategory = document.getElementById('dishCategory').value;
                const dishDesc = document.getElementById('dishDesc').value.trim();
                const file = imageInput.files[0];

                if (!file) throw new Error("Please select an image.");

                // --- STEP 1: UPLOAD IMAGE ---
                let fileExt = file.name.split('.').pop().toLowerCase();
                let safeFileName = dishName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                const finalImageName = `${safeFileName}.${fileExt}`;
                const fullImagePath = `${IMAGE_FOLDER_PATH}${finalImageName}`;

                const base64Image = await toBase64(file);
                const imageApiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${fullImagePath}`;
                
                let existingImage = await getFileFromGitHub(fullImagePath, token);
                
                const imageBody = {
                    message: `Admin: Uploaded image for ${dishName}`,
                    content: base64Image
                };
                if(existingImage) imageBody.sha = existingImage.sha;

                const imgRes = await fetch(imageApiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(imageBody)
                });

                if (!imgRes.ok) {
                    const err = await imgRes.json();
                    throw new Error(`Image upload failed: ${err.message}`);
                }

                // --- STEP 2: UPDATE MENU.JSON FILE ---
                submitBtn.innerHTML = `<i data-lucide="loader" class="spin"></i> Updating Menu...`;
                lucide.createIcons();

                let menuData = [];
                let menuFileSha = null;
                
                const menuFileInfo = await getFileFromGitHub(DATA_FILE_PATH, token);
                
                if (menuFileInfo) {
                    menuFileSha = menuFileInfo.sha;
                    const decodedContent = decodeURIComponent(escape(window.atob(menuFileInfo.content.replace(/\s/g, ''))));
                    menuData = JSON.parse(decodedContent);
                }

                const newItem = {
                    id: Date.now(),
                    name: dishName,
                    price: dishPrice,
                    cat: dishCategory,
                    desc: dishDesc,
                    img: fullImagePath,
                    veg: true 
                };

                menuData.push(newItem);

                const updatedMenuJson = JSON.stringify(menuData, null, 4);
                const base64Menu = btoa(unescape(encodeURIComponent(updatedMenuJson)));

                const menuApiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;
                const menuBody = {
                    message: `Admin: Added ${dishName} to menu`,
                    content: base64Menu
                };
                if (menuFileSha) menuBody.sha = menuFileSha;

                const menuRes = await fetch(menuApiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(menuBody)
                });

                if (!menuRes.ok) {
                    const err = await menuRes.json();
                    throw new Error(`Failed to update menu.json: ${err.message}`);
                }

                alert(`Success! ${dishName} has been added to the website.`);
                document.getElementById('uploadForm').reset();
                previewImg.style.display = 'none';

            } catch (error) {
                console.error(error);
                alert(`Error: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="check-circle"></i> Upload to Website`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
